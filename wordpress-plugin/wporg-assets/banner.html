<!doctype html><html><head><style>
*{box-sizing:border-box;margin:0}
html,body{width:772px;height:250px;overflow:hidden}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f7f7fb;color:#14142b;position:relative;zoom:var(--z)}
.bg{position:absolute;right:-60px;top:-80px;width:430px;height:430px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#eef0ff 0%,#e3e6ff 55%,rgba(238,240,255,0) 70%)}
.l{position:absolute;left:44px;top:50px;width:420px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:54px;height:54px}
.brand b{font-size:44px;letter-spacing:-0.03em;font-weight:750}
.t{margin-top:18px;font-size:21px;line-height:1.3;color:#14142b;font-weight:600;letter-spacing:-0.01em}
.s{margin-top:8px;font-size:13.5px;white-space:nowrap;color:#5c5f7a}
.card{position:absolute;right:40px;top:38px;width:262px;background:#fff;border:1px solid #e4e4ef;border-radius:14px;box-shadow:0 10px 30px rgba(20,20,43,.10);padding:14px 14px 10px}
.card h4{font-size:11.5px;color:#5c5f7a;font-weight:600;margin-bottom:9px;text-transform:uppercase;letter-spacing:.06em}
.tool{display:flex;justify-content:space-between;align-items:center;font:12.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:7px 8px;border-radius:8px;background:#f6f6fb;margin-bottom:6px;color:#14142b}
.tool i{font-style:normal;font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;color:#047857;background:#d1fae5;border-radius:99px;padding:3px 7px}
.tool.hl{background:#eef0ff;outline:1.5px solid #4338ca}
</style></head><body><div class="bg"></div>
<div class="l"><div class="brand"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8" fill="#4338ca"/><path d="M9 22.5 15.2 8h1.6L23 22.5h-3.1l-1.4-3.5h-5.1l-1.4 3.5zm5.4-6.1h3.1L16 12.3z" fill="#fff"/><circle cx="24.5" cy="9" r="2.5" fill="#34d399"/></svg><b>agentprose</b></div>
<div class="t">Let AI agents read, search and cite your posts.</div>
<div class="s">Read-only WebMCP tools for WordPress. No account needed.</div></div>
<div class="card"><h4>WebMCP tools</h4>
<div class="tool">search_posts<i>read-only</i></div>
<div class="tool">get_post<i>read-only</i></div>
<div class="tool hl">get_citation<i>read-only</i></div>
<div class="tool">get_section<i>read-only</i></div>
</div></body></html>
